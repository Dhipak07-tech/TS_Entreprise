server:
  port: 8080

spring:
  application:
    name: connectit-platform

  datasource:
    url: jdbc:mysql://localhost:3306/CONNECTIT_DB?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: "Dhipak#2006#"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

# JWT Configuration
app:
  jwt:
    secret: connectit-enterprise-itsm-platform-super-secret-key-2026-must-be-at-least-256-bits
    expiration-ms: 86400000  # 24 hours
    refresh-expiration-ms: 604800000  # 7 days

  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.connectit: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
